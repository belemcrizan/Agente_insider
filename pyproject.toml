[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-insider"
version = "0.1.0"
description = "Investigação de hipóteses sobre alertas PF/PJ com evidências e revisão humana"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<3", "pydantic>=2.7,<3"]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "build>=1,<2"]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
agente-insider = "agente_insider.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agente_insider.agents" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src", "."]
markers = ["integration: integrações locais com clientes simulados, sem rede"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]
